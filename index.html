<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清洁生产辅助能资源消耗分析工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#f0f2f5;min-height:100vh;color:#333}
.app{max-width:1400px;margin:0 auto;padding:16px}

/* 顶部 */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.app-header h1{font-size:20px;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.app-header h1 span{font-size:11px;background:#2563eb;color:#fff;padding:2px 8px;border-radius:10px}

/* 卡片通用 */
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card-title{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:6px}

/* 行业选择行 */
.industry-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:#888;font-weight:600}
.field select,.field input{padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;background:#fff;color:#333;min-width:140px}
.field select:focus,.field input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.benchmark-info{background:#f0f7ff;border:1px solid #b3d4fc;border-radius:6px;padding:8px 12px;font-size:11px;color:#1a56db;line-height:1.6}
.benchmark-info strong{color:#1e40af}

/* 主表格 */
.main-table{width:100%;border-collapse:collapse;font-size:12px}
.main-table th{background:#1a1a2e;color:#fff;padding:8px 6px;font-weight:600;text-align:center;white-space:nowrap}
.main-table td{padding:6px;border:1px solid #e8e8e8;text-align:center;vertical-align:middle}
.main-table tr:hover td{background:#fafbfc}
.main-table .row-label{background:#f8f9fa;font-weight:600;color:#555;text-align:left;padding-left:10px;white-space:nowrap;min-width:90px}
.main-table .row-label.energy-row{background:#eef2ff;color:#1e40af}
.main-table .row-label.output-row{background:#f0fdf4;color:#166534}
.main-table .row-label.total-row{background:#fef3c7;color:#92400e}
.main-table .row-label.action-row{background:#f8f9fa;color:#888;font-size:11px}
.main-table .year-header{background:#1e40af !important;min-width:130px}
.main-table input[type="number"]{width:80px;padding:5px 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;text-align:center}
.main-table input[type="number"]:focus{outline:none;border-color:#2563eb}
.main-table select{padding:5px 4px;border:1px solid #d9d9d9;border-radius:4px;font-size:11px;text-align:center}
.main-table .tce-cell{background:#dcfce7;color:#166534;font-weight:700;font-size:12px}
.main-table .unit-input{width:50px !important;font-size:10px !important;color:#888}
.main-table .add-btn{background:none;border:1px dashed #bbb;color:#888;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.main-table .add-btn:hover{border-color:#2563eb;color:#2563eb}
.main-table .del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;padding:0 4px}
.main-table .del-btn:hover{color:#dc2626}
.main-table .year-del{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;margin-left:6px}
.main-table .year-del:hover{color:#fff}

/* 折标系数 */
.coef-bar{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #e8e8e8;font-size:11px;color:#888}
.coef-bar .coef-item{display:flex;align-items:center;gap:4px}
.coef-bar .coef-item label{font-weight:600}
.coef-bar .coef-item input{width:60px;padding:3px 5px;border:1px solid #d9d9d9;border-radius:4px;font-size:11px;text-align:center}

/* 操作栏 */
.action-bar{display:flex;gap:10px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid #e8e8e8}
.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-ghost{background:#f5f5f5;color:#666;border:1px solid #d9d9d9}.btn-ghost:hover{background:#e8e8e8}

/* 图表 */
.chart-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.chart-toolbar .sep{width:1px;height:20px;background:#e8e8e8;margin:0 4px}
.chart-btn{padding:5px 12px;border:1px solid #d9d9d9;border-radius:14px;background:#fff;cursor:pointer;font-size:11px;color:#666;transition:all .2s}
.chart-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.chart-btn:hover:not(.active){border-color:#2563eb;color:#2563eb}
.chart-box{position:relative;height:320px}

/* 报告 */
.report-full{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.report-full h2{font-size:16px;color:#1a1a2e;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #2563eb}
.chapter{margin-bottom:16px}
.chapter h3{font-size:13px;color:#1e40af;margin-bottom:8px;padding-left:8px;border-left:3px solid #2563eb}
.chapter p{font-size:12px;line-height:1.9;color:#555;text-indent:2em;margin-bottom:6px}
.chapter ul{margin:6px 0 6px 24px;font-size:12px;color:#555;line-height:1.8}
.chapter li{margin-bottom:3px}
.chapter table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.chapter table th{background:#1e40af;color:#fff;padding:5px 8px;text-align:center}
.chapter table td{padding:5px 8px;border:1px solid #e8e8e8;text-align:center}
.chapter table tr:nth-child(even){background:#f8f9fa}
.highlight{background:#f0f7ff;border-left:3px solid #2563eb;padding:10px 12px;border-radius:0 6px 6px 0;margin:8px 0}
.highlight p{text-indent:0 !important;color:#1e40af;font-size:12px}
.conclusion{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #86efac;border-radius:8px;padding:12px;margin-top:12px}
.conclusion p{color:#166534;font-size:12px;text-indent:2em;margin-bottom:4px}

/* 两列 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.metric-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin:2px;font-weight:600;color:#fff}
.metric-tag.blue{background:#2563eb}.metric-tag.green{background:#059669}.metric-tag.red{background:#dc2626}.metric-tag.orange{background:#d97706}.metric-tag.purple{background:#7c3aed}

.item-card{background:#f8f9fa;border-radius:6px;padding:10px;margin-bottom:6px;border-left:3px solid #2563eb}
.item-card h4{font-size:12px;color:#1a1a2e;margin-bottom:4px}
.item-card p{font-size:11px;color:#666;line-height:1.6}
.item-card.warn{border-color:#d97706}.item-card.good{border-color:#059669}.item-card.bad{border-color:#dc2626}
.tag-s{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;color:#fff;margin-right:4px;font-weight:600}
.tag-s.high{background:#dc2626}.tag-s.mid{background:#d97706}.tag-s.low{background:#059669}

.empty{text-align:center;padding:30px;color:#bbb;font-size:13px}

@media(max-width:1000px){.two-col{grid-template-columns:1fr}.main-table{font-size:11px}.main-table input[type="number"]{width:65px}}
</style>
</head>

<div class="app-header">

<!-- 数据录入 -->

    </div>
    <div class="coef-bar">
        <span style="font-weight:700;color:#555">折标系数(kgce)：</span>
        <div class="coef-item"><label>电力</label><input type="number" id="c-elec" value="0.1229" step="0.0001" onchange="recalcAll()"></div>
        <div class="coef-item"><label>天然气</label><input type="number" id="c-gas" value="1.2143" step="0.0001" onchange="recalcAll()"></div>
        <div class="coef-item"><label>原煤</label><input type="number" id="c-coal" value="714.3" step="0.1" onchange="recalcAll()"></div>
        <div class="coef-item"><label>蒸汽</label><input type="number" id="c-steam" value="0.1286" step="0.0001" onchange="recalcAll()"></div>
        <div class="coef-item"><label>柴油</label><input type="number" id="c-diesel" value="1.4571" step="0.0001" onchange="recalcAll()"></div>
        <div class="coef-item"><label>汽油</label><input type="number" id="c-gasoline" value="1.4714" step="0.0001" onchange="recalcAll()"></div>
        <div class="coef-item"><label>液化气</label><input type="number" id="c-lpg" value="1714.3" step="0.1" onchange="recalcAll()"></div>
        <div class="coef-item"><label>重油</label><input type="number" id="c-heavy" value="1428.6" step="0.1" onchange="recalcAll()"></div>
    </div>
    <div class="action-bar">
        <button class="btn btn-primary" onclick="generate()">📈 生成分析报告</button>
        <button class="btn btn-ghost" onclick="loadDemo()">📝 加载示例</button>
    </div>
</div>

<!-- 图表 -->
<div class="card" id="chartCard" style="display:none">
    <div class="card-title">📉 数据可视化</div>
    <div class="chart-toolbar">
        <button class="chart-btn active" data-t="bar" onclick="setCT('bar',this)">柱状图</button>
        <button class="chart-btn" data-t="line" onclick="setCT('line',this)">折线图</button>
        <button class="chart-btn" data-t="pie" onclick="setCT('pie',this)">饼图</button>
        <div class="sep"></div>
        <button class="chart-btn active" data-d="total" onclick="setCD('total',this)">综合能耗</button>
        <button class="chart-btn" data-d="struct" onclick="setCD('struct',this)">能源结构</button>
        <button class="chart-btn" data-d="intensity" onclick="setCD('intensity',this)">产值能耗</button>
        <button class="chart-btn" data-d="bench" onclick="setCD('bench',this)">行业对标</button>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div id="summary" style="margin-top:10px"></div>
</div>

<!-- 报告 -->
<div id="reportArea" style="display:none">
    <div class="report-full" id="reportContent"></div>
    <div class="two-col">
        <div class="card"><div class="card-title">⚠️ 问题识别与改进潜力</div><div id="problems"><div class="empty">生成报告后显示</div></div></div>
        <div class="card"><div class="card-title">💡 清洁生产方案建议</div><div id="suggestions"><div class="empty">生成报告后显示</div></div></div>
    </div>
</div>

</div>

    h+='<td></td></tr>';
    
    h+='</tbody>';
    t.innerHTML=h;
}

/* ========== 数据操作 ========== */
function calcTce(type,val,unit){
    const v=parseFloat(val)||0;
    if(!v) return '0.00';
    const coefMap={electricity:'c-elec',natural_gas:'c-gas',coal:'c-coal',steam:'c-steam',diesel:'c-diesel',gasoline:'c-gasoline',lpg:'c-lpg',heavy_oil:'c-heavy'};
    let coef=parseFloat(document.getElementById(coefMap[type])?.value)||0;
    if(unit==='万kWh') coef*=10000;
    else if(unit==='万m³') coef*=10000;
    else if(unit==='万t') coef*=10000000;
    else if(unit==='kg') coef/=1000;
    return (v*coef/1000).toFixed(2);
}

function setVal(ei,year,field,val){
    if(field==='v') energies[ei].vals[year]=val;
    else energies[ei].units[year]=val;
    render();
}

function chgEType(ei,type){
    energies[ei].type=type;
    energies[ei].units={};
    render();
}

function addEnergy(){
    energies.push({type:'electricity',vals:{},units:{}});
    render();
}

function delEnergy(ei){
    if(energies.length<=1){alert('至少保留一种能源');return;}
    energies.splice(ei,1);
    render();
}

function addYear(){
    const last=years.length?years[years.length-1].y:new Date().getFullYear();
    years.push({y:last+1,output:'',ou:'吨',value:'',vu:'万元'});
    render();
}

function delYear(yi){
    if(years.length<=1){alert('至少保留一个年份');return;}
    years.splice(yi,1);
    render();
}

function chgYear(yi,newY){
    newY=parseInt(newY);
    if(!newY||newY<1900||newY>2100){alert('请输入有效年份');render();return;}
    if(years.some((y,i)=>i!==yi&&y.y===newY)){alert('年份不能重复');render();return;}
    const oldY=years[yi].y;
    // 同步更新 energies 中的 vals 和 units 键名
    energies.forEach(en=>{
        if(en.vals[oldY]!==undefined){en.vals[newY]=en.vals[oldY];delete en.vals[oldY];}
        if(en.units[oldY]!==undefined){en.units[newY]=en.units[oldY];delete en.units[oldY];}
    });
    years[yi].y=newY;
    render();
}

/* ========== 图表 ========== */
function setCT(t,el){cType=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(document.getElementById('chartCard').style.display!=='none')drawChart();}
function setCD(d,el){cDim=d;document.querySelectorAll('[data-d]').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(document.getElementById('chartCard').style.display!=='none')drawChart();}

function getData(){
    return years.filter(y=>y.y&&energies.some(en=>parseFloat(en.vals[y.y])>0)).map(y=>{
        const tce=energies.reduce((s,en)=>s+parseFloat(calcTce(en.type,en.vals[y.y]||'',en.units[y.y]||ET[en.type]?.d||'')),0);
        const val=parseFloat(y.value)||0;
        const struct={};
        energies.forEach(en=>{if(parseFloat(en.vals[y.y])>0){const n=ET[en.type]?.n||en.type;struct[n]=(struct[n]||0)+parseFloat(calcTce(en.type,en.vals[y.y],en.units[y.y]||ET[en.type]?.d||''));}});
        return{y:y.y,tce,output:parseFloat(y.output)||0,value:val,iv:val>0?tce/val:0,struct:Object.entries(struct).map(([t,v])=>({t,v}))};
    });
}

const dlCfg={display:true,color:'#1a1a2e',font:{size:10,weight:'bold'},anchor:'end',align:'top',offset:3,formatter:v=>typeof v==='number'?(v>=100?v.toFixed(0):v>=1?v.toFixed(1):v.toFixed(2)):v};
const pieCfg={display:true,color:'#fff',font:{size:10,weight:'bold'},formatter:(v,c)=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);return c.chart.data.labels[c.dataIndex]+'\n'+((v/t)*100).toFixed(1)+'%'}};

function drawChart(){
    const ctx=document.getElementById('chart').getContext('2d');
    if(chart)chart.destroy();

    if(!data.length)return;
    let cfg={options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{color:'#333',font:{size:11}}},title:{display:true,text:'',font:{size:13,weight:'bold'},color:'#1a1a2e'},datalabels:dlCfg}}};
    
    if(cDim==='bench'){
        if(!selCat||!selSub){alert('请先选择行业');return;}
        const bm=DB[selCat].s[selSub];
        const latest=data.filter(d=>d.iv>0).pop()?.iv||0;
        cfg.type='bar';cfg.data={labels:['行业平均','企业当前（最近一年）'],datasets:[{label:'产值能耗',data:[bm.e,+latest.toFixed(3)],backgroundColor:['#94a3b8','#2563eb'],borderRadius:6}]};
        cfg.options.plugins.title.text='行业对标（tce/万元）';
        cfg.options.scales={y:{beginAtZero:true},x:{ticks:{color:'#666'}}};
    }else if(cDim==='struct'){
        const types=[...new Set(data.flatMap(d=>d.struct.map(e=>e.t)))];
        cfg.type='bar';cfg.data={labels:data.map(d=>d.y+'年'),datasets:types.map((t,i)=>({label:t,data:data.map(d=>{const f=d.struct.find(e=>e.t===t);return f?+f.v.toFixed(2):0}),backgroundColor:COLORS[i%8],borderRadius:3}))};
        cfg.options.plugins.title.text='能源消费结构（tce）';
        cfg.options.scales={x:{stacked:true,ticks:{color:'#666'}},y:{stacked:true,beginAtZero:true,ticks:{color:'#666'}}};
    }else if(cDim==='intensity'){
        const id=data.filter(d=>d.iv>0);
        if(!id.length){alert('请录入产值');return;}
        const ds=[{label:'产值能耗',data:id.map(d=>+d.iv.toFixed(4)),backgroundColor:'#059669',borderColor:'#059669',borderWidth:2,borderRadius:6}];
        if(selCat&&selSub){const bm=DB[selCat].s[selSub];ds.push({label:'行业平均',data:Array(id.length).fill(bm.e),borderColor:'#d97706',borderWidth:2,borderDash:[5,3],fill:false,type:'line',pointRadius:0});}
        cfg.type=cType;cfg.data={labels:id.map(d=>d.y+'年'),datasets:ds};
        cfg.options.plugins.title.text='产值能耗趋势（tce/万元）';
        cfg.options.scales={y:{beginAtZero:true},x:{ticks:{color:'#666'}}};
    }else{
        const labels=data.map(d=>d.y+'年'),values=data.map(d=>+d.tce.toFixed(2));
        if(cType==='pie'){
            cfg.type='pie';cfg.data={labels,datasets:[{data:values,backgroundColor:COLORS.slice(0,values.length),borderWidth:2,borderColor:'#fff'}]};
            cfg.options.plugins.title.text='综合能耗占比';cfg.options.plugins.datalabels=pieCfg;delete cfg.options.scales;
        }else{
            cfg.type=cType;cfg.data={labels,datasets:[{label:'综合能耗',data:values,backgroundColor:'#2563eb',borderColor:'#2563eb',borderWidth:2,borderRadius:6,pointRadius:5}]};

            cfg.options.scales={y:{beginAtZero:true,title:{display:true,text:'tce',color:'#888'}},x:{ticks:{color:'#666'}}};
        }
    }
    chart=new Chart(ctx,cfg);
}

    const total=data.reduce((s,d)=>s+d.tce,0),avg=total/data.length;
    const g=data.length>1&&data[0].tce>0?((data[data.length-1].tce-data[0].tce)/data[0].tce*100).toFixed(1):0;
    const id=data.filter(d=>d.iv>0),ai=id.length?id.reduce((s,d)=>s+d.iv,0)/id.length:0;
    document.getElementById('summary').innerHTML=`<span class="metric-tag purple">累计 ${total.toFixed(2)} tce</span><span class="metric-tag blue">年均 ${avg.toFixed(2)} tce</span><span class="metric-tag ${g>0?'red':'green'}">变化 ${g>0?'+':''}${g}%</span><span class="metric-tag orange">产值能耗 ${ai?ai.toFixed(3)+' tce/万元':'未录入'}</span>`;

function renderProblems(data){
    const g=data.length>1&&data[0].tce>0?((data[data.length-1].tce-data[0].tce)/data[0].tce*100):0;
    const ai=data.filter(d=>d.iv>0).reduce((s,d)=>s+d.iv,0)/data.filter(d=>d.iv>0).length||0;
    const ps=[],pts=[];
    if(g>10)ps.push({l:'high',t:'综合能耗增长过快',d:`累计增长${g.toFixed(1)}%，建议排查设备老化、产能扩张未同步提升能效等原因。`});
    else if(g>5)ps.push({l:'mid',t:'综合能耗呈上升趋势',d:`累计增长${g.toFixed(1)}%，建议关注变化趋势，及时控制。`});
    if(selSub&&DB[selCat]?.s[selSub]){const bm=DB[selCat].s[selSub];if(ai>0){if(ai>bm.e*1.3)pts.push({l:'high',t:'节能潜力巨大',d:`高于行业平均${((ai/bm.e-1)*100).toFixed(1)}%，可节约${((1-bm.e/ai)*100).toFixed(1)}%能源。`});else if(ai>bm.e)pts.push({l:'mid',t:'存在优化空间',d:`高于行业平均${((ai/bm.e-1)*100).toFixed(1)}%。`});else pts.push({l:'low',t:'保持领先',d:'已达或优于行业平均。'});}}
    if(!ps.length)ps.push({l:'low',t:'总体良好',d:'未发现显著异常。'});
    if(!pts.length)pts.push({l:'low',t:'持续改进',d:'建议定期能源审计。'});
    document.getElementById('problems').innerHTML=`<div class="item-card${ps[0].l==='high'?' bad':ps[0].l==='mid'?' warn':' good'}"><h4><span class="tag-s ${ps[0].l}">${ps[0].l==='high'?'高':ps[0].l==='mid'?'中':'低'}</span>${ps[0].t}</h4><p>${ps[0].d}</p></div><div class="item-card good"><h4><span class="tag-s ${pts[0].l}">${pts[0].l==='high'?'高':pts[0].l==='mid'?'中':'低'}</span>${pts[0].t}</h4><p>${pts[0].d}</p></div>`;
}
